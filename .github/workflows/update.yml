name: Auto Update Maddy TV Boom Playlist

on:
  schedule:
    # Run every 3 hours to ensure streams and tokens remain fresh
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes in playlist. Skipping commit."
          else
            git commit -m "Auto-update Maddy TV Boom playlist [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
